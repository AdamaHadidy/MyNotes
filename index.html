<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyNotes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyNotes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#23262c">
<style>
:root{--bg:#ecebe6;--fg:#23262c;--card:#fbfaf7;--chip:#ebe8e0;--bar:#23262c;--bar-ink:#f4f2ec;--accent:#e8c35a;--accent-ink:#23262c;--muted:#8b909a;--pill:rgba(255,255,255,.09);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--fg:#ece9e2;--card:#24262c;--chip:#33363d}}
:root[data-theme="dark"]{--bg:#17181b;--fg:#ece9e2;--card:#24262c;--chip:#33363d}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 "Avenir Next",Avenir,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
button{font:inherit;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;min-height:40px;padding:8px 14px;background:var(--chip);color:var(--fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
/* top bars */
header{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:54px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.zone{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.zone.mid{flex:none;justify-content:center;gap:10px}
.zone.end{justify-content:flex-end}
header button{background:transparent;color:var(--bar-ink);width:42px;height:42px;min-height:0;padding:0;border-radius:11px}
header button.txt{width:auto;padding:0 12px;font-weight:600}
header button.on{background:var(--accent);color:var(--accent-ink)}
header button.accent{background:var(--accent);color:var(--accent-ink)}
.pill{display:flex;gap:2px;background:var(--pill);padding:3px;border-radius:14px}
.nav{display:flex;align-items:center}
.nav button{width:34px}
#pg{min-width:54px;text-align:center;color:var(--bar-muted,#aab0ba);font-variant-numeric:tabular-nums}
#homeTitle{font-size:19px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wheel{width:26px;height:26px;border-radius:50%;background:conic-gradient(#f33,#fd3,#3d5,#3dd,#35f,#d3d,#f33);display:grid;place-items:center}
.wheel i{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-sizing:border-box}
/* Home */
#homeView{flex:1;overflow:auto;padding:24px 18px 48px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,150px),1fr));gap:26px 18px;max-width:1000px;margin:0 auto}
.tile{position:relative}
.tile .open{display:block;width:100%;background:none;color:var(--fg);padding:0;text-align:left;min-height:0}
.thumb{aspect-ratio:3/4;background:#fff;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.2),0 4px 14px rgba(0,0,0,.14);overflow:hidden;display:grid;place-items:center;color:#aaa}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.ficon{aspect-ratio:3/4;display:grid;place-items:center}
.fshape{position:relative;width:88%;height:60%;background:var(--fc,var(--folder,#d9a93f));border-radius:6px 10px 10px 10px;box-shadow:0 1px 3px rgba(0,0,0,.2),0 4px 14px rgba(0,0,0,.14)}
.fshape::before{content:"";position:absolute;left:0;top:-12px;width:42%;height:14px;background:var(--fc,var(--folder,#d9a93f));border-radius:8px 8px 0 0}
.name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:9px;font-weight:600;line-height:1.25;word-break:break-word}
.sub{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.more{position:absolute;top:7px;right:7px;width:32px;height:32px;min-height:0!important;padding:0!important;border-radius:16px!important;background:rgba(30,32,38,.72);color:#fff}
.more svg{width:18px;height:18px}
#emptyHome{max-width:36ch;margin:14vh auto 0;text-align:center;color:var(--muted);line-height:1.55}
#emptyHome b{display:block;color:var(--fg);font-size:20px;margin-bottom:6px}
/* Reader */
#stage{flex:1;overflow:auto;position:relative;padding:18px 12px 48px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
#pages{position:relative;width:max-content;margin:0 auto}
.pg{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 6px 22px rgba(0,0,0,.22);margin:0 auto 16px}
.pg canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:pan-x pan-y}
.pg .ink{cursor:crosshair}
/* dialogs and popovers */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20}
.box{background:var(--card);color:var(--fg);border-radius:16px;padding:18px;width:min(360px,90vw);max-height:82vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0 0 2px;font-size:17px;word-break:break-word}
.box p{margin:0;color:var(--muted)}
.box input{font:inherit;padding:11px;border-radius:10px;border:1px solid var(--muted);background:var(--bg);color:var(--fg)}
.box button.primary,.seg button.on{background:var(--accent);color:var(--accent-ink)}
.box button.danger{background:#c93b3b;color:#fff}
.box button.row{justify-content:flex-start}
#pop{position:fixed;z-index:15;background:var(--card);color:var(--fg);border-radius:14px;padding:12px;box-shadow:0 10px 34px rgba(0,0,0,.4);width:min(264px,92vw);display:flex;flex-direction:column;gap:12px}
#pop h4{margin:0;font-size:14px;font-weight:600}
#pop p{margin:0;font-size:13px;color:var(--muted)}
#pop input[type=range]{width:100%}
.rows{display:flex;flex-direction:column;gap:2px}
.rows button{width:100%;justify-content:flex-start;background:transparent;padding:10px 8px;border-radius:9px}
.rows button.danger{color:#c93b3b}
.rows hr{border:0;border-top:1px solid var(--chip);margin:4px 0;width:100%}
.prev{height:64px;display:grid;place-items:center;background:var(--bg);border-radius:10px;overflow:hidden}
.prev i{display:block;box-sizing:border-box}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px 6px}
.wheelbox{position:relative;width:200px;height:200px;margin:0 auto;touch-action:none}
.wheelbox canvas{display:block;width:200px;height:200px;border-radius:50%}
.wheelbox i{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #0008;pointer-events:none}
.bright{-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;border:1px solid #0003}
.bright::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #0006}
.bright::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #0006}
.sws{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sws button{aspect-ratio:1;min-height:0;padding:0;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px #0003}
.sws button.on{border-color:var(--fg)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(30,32,38,.94);color:#fff;padding:10px 16px;border-radius:12px;z-index:30;max-width:90vw;pointer-events:none}
#reader{flex:1;min-height:0;display:flex;flex-direction:column}
body.tb-bottom #reader{flex-direction:column-reverse}
body.tb-left #reader{flex-direction:row}
body.tb-right #reader{flex-direction:row-reverse}
#readBar{position:relative;top:auto;flex:none}
body.tb-left #readBar,body.tb-right #readBar{flex-direction:column;width:62px;padding:8px 6px;overflow-y:auto;justify-content:space-between}
body.tb-left #readBar .zone,body.tb-right #readBar .zone{flex:none;flex-direction:column}
body.tb-left .pill,body.tb-right .pill,body.tb-left .nav,body.tb-right .nav{flex-direction:column}
#viewer{flex:1;min-height:0;min-width:0;position:relative;display:flex}
#pages.spread{display:grid;grid-template-columns:auto auto;column-gap:16px;justify-content:center;align-items:start}
#textBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;max-width:calc(100% - 20px);display:flex;gap:2px;align-items:center;overflow-x:auto;background:var(--bar);color:var(--bar-ink);padding:5px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#textBar button{background:transparent;color:var(--bar-ink);width:38px;height:38px;min-height:0;padding:0;border-radius:10px;flex:none}
#textBar button.on{background:var(--accent);color:var(--accent-ink)}
#textBar button:disabled{opacity:.3}
#textBar select,#textBar input{font:inherit;background:var(--pill);color:var(--bar-ink);border:0;border-radius:8px;padding:0 8px;height:38px;flex:none}
#tSize{width:54px;text-align:center}
.tl{position:absolute;inset:0;pointer-events:none}
.tb{position:absolute;box-sizing:border-box;pointer-events:none}
.texting .tb{pointer-events:auto;cursor:text}
.tx{outline:none;white-space:pre-wrap;overflow-wrap:break-word;line-height:1.25;min-height:1.25em;unicode-bidi:plaintext;-webkit-user-select:none;user-select:none;position:relative;z-index:1}
.tb.sel{outline:2px solid #2b7be4;outline-offset:1px}
.grip,.rs{display:none}
.tb.sel .grip{display:block;position:absolute;left:50%;top:-28px;width:46px;height:20px;margin-left:-23px;border-radius:10px;background:#2b7be4;touch-action:none;cursor:grab}
.tb.sel .rs{display:block;position:absolute;right:-9px;top:50%;width:14px;height:34px;margin-top:-17px;border-radius:7px;background:#2b7be4;touch-action:none;cursor:ew-resize}
#searchRow{display:flex;gap:10px;max-width:1000px;margin:0 auto 22px}
#q{flex:1;min-width:0;font:inherit;padding:11px 14px;border:0;border-radius:12px;background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
#sort{font:inherit;padding:0 10px;border:0;border-radius:12px;background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
#homeWrap{flex:1;min-height:0;display:flex}
#homeView{min-width:0}
#side{width:236px;flex:none;background:var(--card);border-right:1px solid rgba(0,0,0,.08);display:flex;flex-direction:column;gap:4px;padding:16px 10px;overflow-y:auto}
#side .grow{flex:1}
.brand{font-size:20px;font-weight:700;padding:4px 10px 12px}
.nav-item{width:100%;justify-content:flex-start;background:transparent;color:var(--fg);padding:10px;border-radius:10px;font-weight:600}
.nav-item.on{background:var(--chip)}
.side-h{margin:16px 10px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.side-empty{margin:4px 10px;color:var(--muted);font-size:13px}
.rec{width:100%;justify-content:flex-start;background:transparent;color:var(--fg);padding:6px 8px;gap:10px;border-radius:10px;text-align:left}
.rthumb{width:34px;height:46px;flex:none;background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.3);overflow:hidden;display:block}
.rthumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.rname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;line-height:1.25;word-break:break-word}
#sideBtn{display:none}
@media (max-width:760px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:12;width:min(280px,82vw);padding-top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-103%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.35)}
  #side.open{transform:none}
  #sideBtn{display:inline-flex}
}
.box.wide{width:min(500px,92vw)}
.sh{margin:12px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.srow.col{flex-direction:column;align-items:stretch;gap:6px}
.schemes{display:flex;gap:8px;flex-wrap:wrap}
.scheme{width:42px;height:42px;min-height:0;padding:0;border-radius:12px;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.scheme.on{border-color:var(--fg)}
.box select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--muted);background:var(--bg);color:var(--fg)}
.switch{width:48px;height:28px;min-height:0;padding:0;border-radius:14px;background:var(--chip);position:relative;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.hlu{position:absolute;inset:0;white-space:pre-wrap;overflow-wrap:break-word;line-height:1.25;unicode-bidi:plaintext;pointer-events:none;z-index:0;color:transparent}
.hlu span{border-radius:2px}
.hldot{width:22px;height:22px;border-radius:6px;display:block;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)}
.tb.editing{outline:2px dashed #2b7be4;outline-offset:1px}
.tb.editing .tx{-webkit-user-select:text;user-select:text;cursor:text}
#selBar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:6px;background:var(--bar);color:var(--bar-ink);padding:8px 10px;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.4);max-width:calc(100vw - 20px);overflow-x:auto}
#selBar button{background:var(--pill);color:var(--bar-ink);min-height:38px;padding:0 12px;flex:none}
#selBar button.danger{background:#c93b3b;color:#fff}
#selBar button:disabled{opacity:.35}
#selCount{font-weight:600;padding:0 8px;flex:none}
.check{display:none;position:absolute;top:7px;left:7px;width:28px;height:28px;border-radius:14px;background:rgba(30,32,38,.55);color:#fff;place-items:center;border:2px solid #fff}
.selecting .check{display:grid}
.selecting .more{display:none}
.tile.picked .check{background:var(--accent);color:var(--accent-ink)}
.tile.picked .thumb,.tile.picked .fshape{outline:3px solid var(--accent);outline-offset:3px}
.tile{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile img{-webkit-user-drag:none;pointer-events:none}
.tile.dragging{opacity:.35}
.tile.ghost{position:fixed;z-index:40;pointer-events:none;opacity:.92;box-shadow:0 12px 30px rgba(0,0,0,.4);border-radius:8px}
.ghost .more,.ghost .check{display:none!important}
.tile.drop .fshape{outline:3px solid var(--accent);outline-offset:5px}
.nav-item.drop,#back.drop{background:var(--accent)!important;color:var(--accent-ink)!important}
#readBar .zone{flex:none}
body.tb-top #readBar,body.tb-bottom #readBar{overflow-x:auto}
body.tb-top #readBar .zone.end,body.tb-bottom #readBar .zone.end{margin-left:auto}
#snap.on{background:var(--accent);color:var(--accent-ink)}
#calc{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 84px);z-index:14;width:304px;max-width:calc(100vw - 16px);background:var(--card);color:var(--fg);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.45);overflow:hidden;outline:none;-webkit-user-select:none;user-select:none}
#calcHead{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bar);color:var(--bar-ink);cursor:grab;touch-action:none}
#calcHead strong{flex:1}
#calcHead button{background:var(--pill);color:var(--bar-ink);min-height:34px;min-width:36px;padding:0 10px;border-radius:9px}
#cDisp{padding:10px 14px 6px;text-align:right}
#cExp{min-height:20px;color:var(--muted);font-size:15px;overflow-x:auto;white-space:nowrap}
#cRes{font-size:34px;font-weight:600;overflow-x:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
#cKeys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px 12px}
#cKeys button{min-height:42px;padding:0;border-radius:10px;font-size:16px;touch-action:manipulation}
.k-num{background:var(--bg);color:var(--fg);font-weight:600}
.k-op,.k-fn{background:var(--chip);color:var(--fg)}
.k-fn{font-size:14px!important}
.k-mem{background:transparent;color:var(--muted);font-size:13px!important}
.k-clr{background:#c9573b;color:#fff}
.k-eq{background:var(--accent);color:var(--accent-ink);font-weight:700}
.fl{position:absolute;inset:0;display:grid;place-items:center;padding:8px;text-align:center;overflow:hidden;color:var(--ft,#fff)}
.fl.ic{font-size:42px;line-height:1}
.fl .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:700;font-size:15px;line-height:1.2;word-break:break-word}
.name:empty{display:none}
.fprev{width:110px;margin:0 auto}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icons button{aspect-ratio:1;min-height:0;padding:0;font-size:22px}
.icons button.on{outline:3px solid var(--accent)}
.box input[type=color]{padding:2px;height:40px;width:100%}
/* ---------- motion ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sheetOut{to{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:scale(.94)}}
@keyframes calcIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
@keyframes barDown{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes barDownOut{to{opacity:0;transform:translateX(-50%) translateY(-6px)}}
@keyframes barUp{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes barUpOut{to{opacity:0;transform:translateX(-50%) translateY(8px)}}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tileIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes turnNext{from{opacity:0;transform:translateX(38px)}to{opacity:1;transform:none}}
@keyframes turnPrev{from{opacity:0;transform:translateX(-38px)}to{opacity:1;transform:none}}
@keyframes checkPop{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes boxIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes ghostIn{from{opacity:.4;transform:scale(.8)}to{opacity:.92;transform:scale(1.03)}}
@keyframes barSwap{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
button{transition:background-color .18s,color .18s,transform .12s,opacity .18s,box-shadow .18s}
button:active:not(:disabled){transform:scale(.95)}
.tile .open:active{transform:none}
body,header,#side,.box,#pop,#calc,#textBar,#selBar,.thumb,#q,#sort{transition:background-color .35s ease,color .35s ease,border-color .35s ease}
#modal.in{animation:fadeIn .18s ease both}
#modal.in .box{animation:sheetIn .24s cubic-bezier(.2,.85,.25,1) both}
#modal.out{animation:fadeOut .16s ease forwards;pointer-events:none}
#modal.out .box{animation:sheetOut .16s ease forwards}
#pop.in{animation:popIn .16s cubic-bezier(.2,.85,.25,1) both}
#pop.out{animation:popOut .12s ease forwards;pointer-events:none}
#calc.in{animation:calcIn .24s cubic-bezier(.2,.85,.25,1) both}
#calc.out{animation:popOut .14s ease forwards;pointer-events:none}
#textBar.in{animation:barDown .2s cubic-bezier(.2,.85,.25,1) both}
#textBar.out{animation:barDownOut .14s ease forwards}
#selBar.in{animation:barUp .22s cubic-bezier(.2,.85,.25,1) both}
#selBar.out{animation:barUpOut .15s ease forwards}
#toast.in{animation:barUp .22s cubic-bezier(.2,.85,.25,1) both}
#toast.out{animation:barUpOut .18s ease forwards}
#reader.in{animation:viewIn .3s cubic-bezier(.2,.85,.25,1) both}
#homeWrap.in,#homeBar.in{animation:fadeIn .25s ease both}
#readBar.swap{animation:barSwap .28s cubic-bezier(.2,.85,.25,1) both}
